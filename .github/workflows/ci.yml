name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      DMR_SITE_INDEXING_ENABLED: "true"
      DMR_PREVIEW_CONTENT_ENABLED: "true"
      DMR_SITE_URL: "https://deepwaters.example.test"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Expected revision: $expected"
          echo "Checked out revision: $actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify npm policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm config get strict-allow-scripts)" = "true"
          test "$(npm config get engine-strict)" = "true"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify FFmpeg for evidence regressions
        run: ffmpeg -version && ffprobe -version

      - name: Domain regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production route smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3210 npm run start -- -p 3210 > /tmp/deep-movie-review-next.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3210/ > /tmp/home.html; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "Production server did not become ready."
            cat /tmp/deep-movie-review-next.log
            exit 1
          fi

          curl --fail --silent --show-error --dump-header /tmp/home.headers --output /dev/null http://127.0.0.1:3210/
          grep -Fqi 'content-security-policy:' /tmp/home.headers
          grep -Fqi "frame-ancestors 'none'" /tmp/home.headers
          grep -Fqi 'x-content-type-options: nosniff' /tmp/home.headers
          grep -Fqi 'x-frame-options: DENY' /tmp/home.headers
          grep -Fqi 'referrer-policy: strict-origin-when-cross-origin' /tmp/home.headers
          grep -Fqi 'permissions-policy: camera=(), microphone=(), geolocation=(), payment=()' /tmp/home.headers

          if grep -Fq 'Структурный стенд' /tmp/home.html; then
            site_state="prelaunch"
            if ! grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/home.html; then
              echo "Prelaunch homepage must remain noindex/nofollow even when the launch flag is enabled."
              exit 1
            fi
          elif grep -Fq 'Открыть разбор' /tmp/home.html; then
            site_state="published-preview"
            if ! grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/home.html; then
              echo "Preview builds must remain noindex/nofollow even when the configured homepage film is published."
              exit 1
            fi
          else
            echo "Homepage did not expose a recognized configured feature state."
            exit 1
          fi
          echo "Verified homepage state: $site_state"

          curl --fail --silent --show-error http://127.0.0.1:3210/labs/six-lenses > /tmp/lab.html
          if ! grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/lab.html; then
            echo "R&D lab routes must remain noindex/nofollow."
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3210/robots.txt > /tmp/preview-robots.txt
          grep -Fq 'Disallow: /' /tmp/preview-robots.txt

          curl --fail --silent --show-error http://127.0.0.1:3210/sitemap.xml > /tmp/preview-sitemap.xml
          for forbidden_path in '/labs/' '/films/the-truman-show' '/films/the-fast-and-the-furious' '/films/pilot-film'; do
            if grep -Fq "$forbidden_path" /tmp/preview-sitemap.xml; then
              echo "Preview sitemap leaked non-public route: $forbidden_path"
              exit 1
            fi
          done

          grep -Eq 'rel="canonical"[^>]*href="https://deepwaters\.example\.test/?"|href="https://deepwaters\.example\.test/?"[^>]*rel="canonical"' /tmp/home.html
          grep -Fq 'Предполагаемый тезис' /tmp/home.html
          if grep -Fq 'Явная теза' /tmp/home.html; then
            echo "Homepage leaked legacy apparent-claim label."
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3210/films > /tmp/preview-films.html
          grep -Eq 'rel="canonical"[^>]*href="https://deepwaters\.example\.test/films"|href="https://deepwaters\.example\.test/films"[^>]*rel="canonical"' /tmp/preview-films.html
          if ! grep -Fq 'Шоу Трумана' /tmp/preview-films.html; then
            echo "Preview film index did not expose the Film 001 draft."
            exit 1
          fi
          if ! grep -Fq 'Форсаж' /tmp/preview-films.html; then
            echo "Preview film index did not expose the Film 002 draft."
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3210/films/the-truman-show > /tmp/truman-draft.html
          grep -Fq 'Шоу Трумана' /tmp/truman-draft.html
          grep -Fq 'Источники и издание — Шоу Трумана' /tmp/truman-draft.html

          curl --fail --silent --show-error 'http://127.0.0.1:3210/films/the-truman-show?spoilers=FULL' > /tmp/truman-full.html
          grep -Fq 'Труман Бёрбанк' /tmp/truman-full.html
          grep -Fq 'Труман и Мэрил: брак как контракт' /tmp/truman-full.html
          grep -Fq 'Уйти или остаться' /tmp/truman-full.html

          curl --fail --silent --show-error http://127.0.0.1:3210/films/the-fast-and-the-furious > /tmp/fast-draft.html
          grep -Fq 'Форсаж' /tmp/fast-draft.html
          grep -Fq 'Источники и издание — Форсаж' /tmp/fast-draft.html
          if ! grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/fast-draft.html; then
            echo "Film 002 draft route must remain noindex/nofollow in preview."
            exit 1
          fi

          curl --fail --silent --show-error 'http://127.0.0.1:3210/films/the-fast-and-the-furious?spoilers=FULL' > /tmp/fast-full.html
          grep -Fq 'Доминик Торетто' /tmp/fast-full.html
          grep -Fq 'Брайан и Дом: доверие под прикрытием' /tmp/fast-full.html
          grep -Fq 'Арестовать или отдать ключи' /tmp/fast-full.html

          # Film 001 ships a LOCKED edition, so its route must not carry the
          # research-draft banner any more; Film 002 is still a research draft.
          grep -Fq 'Исследовательский черновик · вторичные источники · мастер не заблокирован' /tmp/fast-draft.html
          if grep -Fq 'мастер не заблокирован' /tmp/truman-draft.html; then
            echo "Film 001 carries a LOCKED edition; the research-draft banner must not appear."
            exit 1
          fi
          for full_html in /tmp/truman-full.html /tmp/fast-full.html; do
            grep -Fq 'Путь от тезиса к источнику.' "$full_html"
            grep -Fq 'Предполагаемый тезис' "$full_html"
            if grep -Fq 'Мнимый тезис' "$full_html"; then
              echo "Film page leaked legacy apparent-claim label."
              exit 1
            fi
            grep -Fq 'профессиональный источник' "$full_html"
            grep -Fq 'база / каталог / расшифровка' "$full_html"
            for internal_token in 'WRONGDOING' 'VIRTUE' 'MIXED' 'KNOWN_TO_CHARACTER' 'REVEALED_LATER' 'NORMALIZED' 'CELEBRATED' '>reference<' '>film-edition<' '>editorial-note<' '>primary-material<' '>institutional-academic<' '>professional-reference<' '>database-transcript<' '>tertiary-community<'; do
              if grep -Fq "$internal_token" "$full_html"; then
                echo "Russian real-film HTML leaked internal presentation token: $internal_token"
                exit 1
              fi
            done
          done

          # Film 001 is published (docs/53 §2.1), so its preview page previews a public
          # page: noindex here, and the canonical already points at the URL it becomes.
          # Film 002 is still a research draft and must not advertise one.
          if ! grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/truman-draft.html; then
            echo "Published film route must remain noindex/nofollow in a preview build."
            exit 1
          fi
          if ! grep -Eq 'rel="canonical"[^>]*href="https://deepwaters\.example\.test/films/the-truman-show"' /tmp/truman-draft.html; then
            echo "Published film route must advertise its canonical public URL."
            exit 1
          fi
          if grep -Eiq 'rel="canonical"' /tmp/fast-draft.html; then
            echo "Research draft must not advertise a canonical public film URL."
            exit 1
          fi

          curl --fail --silent --show-error 'http://127.0.0.1:3210/films/pilot-film?spoilers=NONE' > /tmp/pilot-none.html
          grep -Fq 'Pilot Film' /tmp/pilot-none.html
          if grep -Fq 'Evidence before conclusion.' /tmp/pilot-none.html; then
            echo "MAJOR spoiler content leaked into spoilers=NONE."
            exit 1
          fi

          curl --fail --silent --show-error 'http://127.0.0.1:3210/films/pilot-film?spoilers=FULL' > /tmp/pilot-full.html
          if ! grep -Fq 'Evidence before conclusion.' /tmp/pilot-full.html; then
            echo "FULL spoiler projection did not render the MAJOR autopsy module."
            exit 1
          fi

          not_found_status=$(curl --silent --output /tmp/not-found.html --write-out '%{http_code}' http://127.0.0.1:3210/films/not-a-film)
          if [[ "$not_found_status" != "200" && "$not_found_status" != "404" ]]; then
            echo "Unknown film route returned unexpected HTTP $not_found_status."
            exit 1
          fi
          if [[ "$not_found_status" == "200" ]] && ! grep -Eiq 'name="robots"[^>]*content="noindex|content="noindex[^>]*name="robots"' /tmp/not-found.html; then
            echo "Streamed soft-404 must include robots noindex."
            exit 1
          fi
          if ! grep -Fq '404 / Не найдено' /tmp/not-found.html; then
            echo "Unknown film route did not render the canonical not-found UI."
            exit 1
          fi
          if grep -Fq 'Pilot Film' /tmp/not-found.html; then
            echo "Unknown film route rendered film content instead of the not-found boundary."
            exit 1
          fi

      - name: Install portable accessibility browsers
        run: npx playwright-core install --with-deps chromium firefox webkit

      - name: Browser visual and accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf browser-audit
          PORT=3212 npm run start -- -p 3212 > /tmp/deep-movie-review-browser-next.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3212/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "Browser-audit production server did not become ready."
            cat /tmp/deep-movie-review-browser-next.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3212 READER_BROWSERS=chromium,firefox,webkit node scripts/reader-regression.mjs
          BASE_URL=http://127.0.0.1:3212 node scripts/browser-audit.mjs
          BASE_URL=http://127.0.0.1:3212 npm run test:a11y

      # Historical recovery is informational, never a substitute for current-head tests.
      - name: Recover previous successful accessibility evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-a11y-evidence.py

      - name: Recover retained native evidence from a completed prior head
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-native-evidence.py

      - name: Publish lossless accessibility diagnostics to checks API
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-a11y-evidence.mjs

      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            browser-audit/
            a11y-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Build public surface without preview content
        env:
          DMR_PREVIEW_CONTENT_ENABLED: "false"
        run: |
          rm -rf .next
          npm run build

      - name: Public surface access smoke test
        env:
          DMR_PREVIEW_CONTENT_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          PORT=3211 npm run start -- -p 3211 > /tmp/deep-movie-review-public-next.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3211/ > /tmp/public-home.html; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "Public production server did not become ready."
            cat /tmp/deep-movie-review-public-next.log
            exit 1
          fi

          if grep -Fq 'Открыть разбор' /tmp/public-home.html; then
            public_state="published"
            if grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/public-home.html; then
              echo "Published public homepage remained noindex despite launch flag and preview mode being disabled."
              exit 1
            fi
          elif grep -Fq 'Читать методологию' /tmp/public-home.html; then
            public_state="prelaunch"
            if ! grep -Eiq 'name="robots"[^>]*content="noindex, nofollow"|content="noindex, nofollow"[^>]*name="robots"' /tmp/public-home.html; then
              echo "Public prelaunch homepage must remain noindex/nofollow."
              exit 1
            fi
          else
            echo "Public homepage did not expose a recognized published or prelaunch state."
            exit 1
          fi
          echo "Verified public homepage state: $public_state"

          # DMR_SITE_INDEXING_ENABLED=true and preview mode off: a public, published
          # site that invites crawlers. `-Fx` matters — "Disallow: /labs/" contains
          # "Disallow: /", so a substring check would pass and fail for the wrong reason.
          curl --fail --silent --show-error http://127.0.0.1:3211/robots.txt > /tmp/public-robots.txt
          if ! grep -Fxq 'Allow: /' /tmp/public-robots.txt; then
            echo "Indexing was requested and preview mode is off; robots.txt must allow the site."
            exit 1
          fi
          if grep -Fxq 'Disallow: /' /tmp/public-robots.txt; then
            echo "robots.txt blanket-disallows a site that was asked to be indexed."
            exit 1
          fi
          grep -Fq 'Disallow: /labs/' /tmp/public-robots.txt
          grep -Fq 'Sitemap: https://deepwaters.example.test/sitemap.xml' /tmp/public-robots.txt

          curl --fail --silent --show-error http://127.0.0.1:3211/sitemap.xml > /tmp/public-sitemap.xml
          for public_path in '/films/the-truman-show</loc>' '/films/the-truman-show/article</loc>' '/films/the-truman-show/making</loc>'; do
            if ! grep -Fq "$public_path" /tmp/public-sitemap.xml; then
              echo "Published sitemap is missing public route: $public_path"
              exit 1
            fi
          done
          for forbidden_path in '/labs/' '/films/the-fast-and-the-furious' '/films/pilot-film'; do
            if grep -Fq "$forbidden_path" /tmp/public-sitemap.xml; then
              echo "Public sitemap leaked non-public route: $forbidden_path"
              exit 1
            fi
          done

          grep -Eq 'rel="canonical"[^>]*href="https://deepwaters\.example\.test/?"|href="https://deepwaters\.example\.test/?"[^>]*rel="canonical"' /tmp/public-home.html

          if ! grep -Fq 'Шоу Трумана' /tmp/public-home.html; then
            echo "Public homepage does not feature the published Film 001."
            exit 1
          fi
          for preview_marker in 'Структурный стенд' 'Pilot Film' 'Character A' 'Character B' 'Fixture statement' 'Форсаж' 'Доминик Торетто' 'исследовательский черновик'; do
            if grep -Fq "$preview_marker" /tmp/public-home.html; then
              echo "Public homepage leaked preview marker: $preview_marker"
              exit 1
            fi
          done

          curl --fail --silent --show-error http://127.0.0.1:3211/films > /tmp/public-films.html
          grep -Eq 'rel="canonical"[^>]*href="https://deepwaters\.example\.test/films"|href="https://deepwaters\.example\.test/films"[^>]*rel="canonical"' /tmp/public-films.html
          if grep -Fq 'Pilot Film' /tmp/public-films.html; then
            echo "Public film index exposed fixture content."
            exit 1
          fi
          if ! grep -Fq 'Шоу Трумана' /tmp/public-films.html; then
            echo "Public film index does not list the published Film 001."
            exit 1
          fi
          if grep -Fq 'Форсаж' /tmp/public-films.html; then
            echo "Public film index exposed the Film 002 draft."
            exit 1
          fi

          # Film 001 is published: the route is a real page on the public site, not a
          # soft-404. Its own robots tag must agree with the layout — these routes once
          # returned `robots: undefined` for a published film, which dropped the
          # layout's noindex and left robots.txt and the page disagreeing.
          truman_status=$(curl --silent --output /tmp/public-truman-route.html --write-out '%{http_code}' http://127.0.0.1:3211/films/the-truman-show)
          if [[ "$truman_status" != "200" ]]; then
            echo "Published Film 001 route returned HTTP $truman_status."
            exit 1
          fi
          if grep -Eiq 'name="robots"[^>]*content="noindex|content="noindex[^>]*name="robots"' /tmp/public-truman-route.html; then
            echo "Published Film 001 route is noindex on a site that allows indexing."
            exit 1
          fi
          if ! grep -Eq 'rel="canonical"[^>]*href="https://deepwaters\.example\.test/films/the-truman-show"' /tmp/public-truman-route.html; then
            echo "Published Film 001 route is missing its canonical URL."
            exit 1
          fi
          grep -Fq 'Труман Бёрбанк' /tmp/public-truman-route.html

          fast_status=$(curl --silent --output /tmp/public-fast-route.html --write-out '%{http_code}' http://127.0.0.1:3211/films/the-fast-and-the-furious)
          if [[ "$fast_status" != "200" && "$fast_status" != "404" ]]; then
            echo "Protected Film 002 draft route returned unexpected HTTP $fast_status."
            exit 1
          fi
          if [[ "$fast_status" == "200" ]] && ! grep -Eiq 'name="robots"[^>]*content="noindex|content="noindex[^>]*name="robots"' /tmp/public-fast-route.html; then
            echo "Streamed Film 002 soft-404 must include robots noindex."
            exit 1
          fi
          if ! grep -Fq '404 / Не найдено' /tmp/public-fast-route.html; then
            echo "Protected Film 002 draft route did not resolve to the not-found boundary."
            exit 1
          fi
          if grep -Fq 'Доминик Торетто' /tmp/public-fast-route.html; then
            echo "Protected Film 002 draft route leaked real-film draft content."
            exit 1
          fi

          preview_status=$(curl --silent --output /tmp/public-preview-route.html --write-out '%{http_code}' http://127.0.0.1:3211/films/pilot-film)
          if [[ "$preview_status" != "200" && "$preview_status" != "404" ]]; then
            echo "Protected preview route returned unexpected HTTP $preview_status."
            exit 1
          fi
          if [[ "$preview_status" == "200" ]] && ! grep -Eiq 'name="robots"[^>]*content="noindex|content="noindex[^>]*name="robots"' /tmp/public-preview-route.html; then
            echo "Streamed preview soft-404 must include robots noindex."
            exit 1
          fi
          if ! grep -Fq '404 / Не найдено' /tmp/public-preview-route.html; then
            echo "Protected preview route did not resolve to the not-found boundary."
            exit 1
          fi
          if grep -Fq 'Pilot Film' /tmp/public-preview-route.html; then
            echo "Protected preview route leaked fixture film content."
            exit 1
          fi

  assistive-desktop:
    name: Actual AT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            reader: safari-voiceover
          - os: windows-2022
            reader: chrome-nvda
    env:
      DMR_PREVIEW_CONTENT_ENABLED: "true"
      DMR_SITE_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Locked install and actual OS screen-reader setup on hosted runner
        run: node scripts/assistive-setup.mjs
      - name: Enable installed Safari WebDriver
        if: runner.os == 'macOS'
        run: sudo /usr/bin/safaridriver --enable
      - run: npm run build
        id: at-build
      - name: Actual AT and native zoom scenarios
        run: node scripts/assistive-audit.mjs
      - name: Publish actual transcripts with verified read-back
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-a11y-evidence.mjs at-report/${{ matrix.reader }} ${{ matrix.reader }}
      - name: Upload actual AT evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-at-${{ matrix.reader }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: at-report/
          if-no-files-found: warn
          retention-days: 7

  # Run Simulator on a clean current macOS image, independently of VoiceOver /
  # accessibility permission setup and the desktop Safari process lifecycle.
  native-ios:
    name: Native iOS Safari
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      DMR_PREVIEW_CONTENT_ENABLED: "true"
      DMR_SITE_INDEXING_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enable installed Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - run: npm run build
      - name: Native iOS Safari on installed iPhone Simulator
        run: node scripts/ios-safari-audit.mjs
      - name: Publish native iOS Safari evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-a11y-evidence.mjs at-report/ios-safari ios-safari
      - name: Upload native iOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-ios-${{ github.event.pull_request.head.sha || github.sha }}
          path: at-report/ios-safari/
          if-no-files-found: error
          retention-days: 7

  rendered-contrast:
    name: Rendered contrast (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      DMR_PREVIEW_CONTENT_ENABLED: "true"
      DMR_SITE_INDEXING_ENABLED: "false"
      A11Y_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the actual engine under assessment
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Assess all current incomplete text-range backgrounds
        run: node scripts/run-contrast-audit.mjs
      - name: Publish measured bounds without relabeling incomplete as pass
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-a11y-evidence.mjs a11y-report contrast-${{ matrix.browser }}
      - name: Preserve original and background-isolation PNG pairs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contrast-${{ matrix.browser }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: a11y-report/
          if-no-files-found: error
          retention-days: 7
