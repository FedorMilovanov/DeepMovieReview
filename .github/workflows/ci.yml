name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Temporary write permission is used only to bootstrap the first canonical
# package-lock.json onto this same-repository PR branch. It is removed once
# the lockfile exists and the workflow switches permanently to npm ci.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head for lockfile bootstrap
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap canonical npm lockfile
        if: ${{ github.event_name == 'pull_request' && hashFiles('package-lock.json') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
