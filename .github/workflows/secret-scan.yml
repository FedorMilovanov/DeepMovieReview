name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: Workflow security contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test secret-scan workflow pins and permissions
        run: node --test tests/workflow-security-contract.test.mjs

  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Scan all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks detect \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=gitleaks-full-history.sarif \
            --log-opts="--all --full-history --sparse"
