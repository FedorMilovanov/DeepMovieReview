name: Secret scanning

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test secret-scan workflow pins and permissions
        run: node --test tests/workflow-security-contract.test.mjs
      - name: Pull immutable Gitleaks image
        run: docker pull "$GITLEAKS_IMAGE"
      - name: Verify Gitleaks version
        run: docker run --rm --network none "$GITLEAKS_IMAGE" version
      - name: Scan all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            "$GITLEAKS_IMAGE" \
            detect \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=/tmp/gitleaks-full-history.sarif \
            --log-opts="--all --full-history --sparse"
