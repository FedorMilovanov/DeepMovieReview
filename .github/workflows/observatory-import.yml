name: Import observatory artwork (one time)
on:
  push:
    branches: [max/152-truman-reading]
    paths: ['.github/workflows/observatory-import.yml']
permissions:
  contents: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/max/152-truman-reading'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: max/152-truman-reading
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download the generated public art through its normal download page
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import sharp from 'sharp';
          const browser = await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          const ctx = await browser.newContext({acceptDownloads:true});
          let resolveDownload;
          const downloadPromise = new Promise(resolve=>{resolveDownload=resolve;});
          const capture = page=>page.on('download',resolveDownload);
          ctx.on('page',capture);
          try {
            const page = await ctx.newPage();
            await page.goto('https://firestorage.ai/en/f/1oNM66yHm8cX',{waitUntil:'domcontentloaded'});
            await page.getByRole('button',{name:'Download',exact:true}).click({timeout:20000});
            let download;
            const visited=new Set();
            for(let i=0;i<30&&!download;i++){
              download=await Promise.race([downloadPromise,new Promise(resolve=>setTimeout(()=>resolve(null),1000))]);
              if(download)break;
              for(const p of ctx.pages()){
                const url=p.url();
                if(!url.startsWith('https://firestorage.ai/')||url.endsWith('/1oNM66yHm8cX')||visited.has(url))continue;
                const button=p.getByRole('button',{name:/^(Download|Download file|Continue to download)$/i}).first();
                if(await button.isVisible().catch(()=>false)){visited.add(url);await button.click();}
                else {const link=p.getByRole('link',{name:/^(Download|Download file|Continue to download)$/i}).first();if(await link.isVisible().catch(()=>false)){visited.add(url);await link.click();}}
              }
            }
            if(!download)throw Error('No file download; normal public UI did not complete.');
            await download.saveAs('/tmp/dmr-observatory.png');
            const bytes=await readFile('/tmp/dmr-observatory.png');
            const sha=createHash('sha256').update(bytes).digest('hex');
            if(sha!=='abeeefd70519b7cd02fb4a6951d2e65c3bb1096b9c101a61c789118af5189565')throw Error('Source hash mismatch');
            const metadata=await sharp(bytes).metadata();
            if(metadata.width!==1672||metadata.height!==941)throw Error('Source dimensions mismatch');
            for(const w of [960,1600])await sharp(bytes).resize(w,Math.round(941*w/1672),{fit:'fill'}).webp({quality:84,effort:6}).toFile('public/art/observatory-'+w+'.webp');
            const crop={left:640,top:0,width:529,height:941};
            for(const w of [540,720])await sharp(bytes).extract(crop).resize(w,Math.round(w*16/9),{fit:'fill'}).webp({quality:84,effort:6}).toFile('public/art/observatory-mobile-'+w+'.webp');
            console.log('Verified source SHA-256:',sha);
          }finally{await browser.close();}
          JS
      - name: Commit only the verified derivatives and remove this transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/observatory-960.webp public/art/observatory-1600.webp public/art/observatory-mobile-540.webp public/art/observatory-mobile-720.webp
          git rm .github/workflows/observatory-import.yml
          git commit -m "Import verified observatory art variants"
          git push origin HEAD:refs/heads/max/152-truman-reading
